<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Com Bootstrap</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col">
                <h2>Preencha o formulário</h2>
                <form>
                    <label for="nome" class="form-label">Insira seu nome:</label>
                    <input type="text" id="nome" class="form-control" pattern="[A-Za-zÀ-ÿ\s]+" inputmode="latin-name" placeholder="Nome completo..." required>
                    <label for="email" class="form-label">Insira seu e-mail:</label>
                    <input type="email" id="email" class="form-control" placeholder="email:exemplo@exemplo.com...">
                    <label for="telefone" class="form-label">Insira seu telefone:</label>
                    <input type="tel" id="telefone" class="form-control" pattern="\(\d{2}\)\s?\d{4,5}-\d{4}" inputmode="numeric" placeholder="(00) 00000-0000...">
                    <button type="submit" class="btn btn-primary mt-3">Enviar</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
