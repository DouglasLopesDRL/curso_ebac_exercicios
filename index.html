<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício_HTML_JS</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <div class="container">
        <h1>Insira os valores:</h1>
        <form id="formulario">
            <input type="number" name="valor1" id="iValor1" placeholder="Insira um valor..." required>
            <p id="msgValor1" class="p-correcao">
                Correção 1
            </p>
            <input type="number" name="valor2" id="iValor2" placeholder="Insira um valor maior..." required>
            <p id="msgValor2" class="p-correcao">
                Correção 2
            </p>
            <button id="btn-form" type="submit">Enviar</button>
            <p id="msg-final">
                Mensagem final
            </p>
            <p id="msg-orientacao">
                Mensagem de orientação.
            </p>
        </form>
    </div>
    <script src="main.js"></script>
    
</body>
</html>
